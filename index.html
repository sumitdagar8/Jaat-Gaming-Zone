<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080b18">
<title>JAAT GAMING ZONE</title>
<style>
:root{color-scheme:dark;--bg:#080b18;--panel:#11182b;--cyan:#67e8f9;--purple:#8b5cf6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation}
header{text-align:center;padding:28px 14px 18px;background:linear-gradient(135deg,#101b38,#180d2d)}
header h1{margin:0;color:var(--cyan);font-size:clamp(27px,5vw,44px);letter-spacing:2px}
header p{color:#bac6df;margin:10px 0 0}
main{max-width:1100px;margin:auto;padding:20px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.game-card{min-height:155px;padding:18px 12px;text-align:center;border:1px solid #293654;border-radius:18px;background:linear-gradient(145deg,#151d34,#101020);color:white;transition:transform .15s,border-color .15s}
.game-card:active{transform:scale(.97)}
.game-card:hover{border-color:var(--cyan)}
.game-icon{font-size:42px;display:block;margin-bottom:12px}
.game-card h3{font-size:17px;margin:0 0 8px}
.game-card p{font-size:12px;color:#aebbd6;margin:0}
footer{text-align:center;padding:25px;color:#8492ae;font-size:12px}

/* Game app screen */
#app{display:none;position:fixed;inset:0;z-index:9999;background:#070914;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);overflow:hidden}
#app.active{display:flex}
.appbar{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.appbar h2{font-size:17px;margin:0;color:var(--cyan);text-align:center;flex:1}
.ui-btn{background:#19233c;border:1px solid #354568;color:white;border-radius:10px;padding:10px 12px;font-size:13px;white-space:nowrap}
.ui-btn:active{background:#344567}
#scoreline{flex-shrink:0;min-height:28px;text-align:center;color:#c6d2ee;font-size:14px;padding:4px}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center;overflow:hidden}
#gameCanvas{display:block;width:100%;height:100%;border:1px solid #273452;border-radius:12px;background:#080b18;touch-action:none}
#help{flex-shrink:0;text-align:center;min-height:32px;padding:8px 2px;color:#a8b5d2;font-size:12px}
#app:fullscreen{padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
#app:fullscreen #stage{min-height:0}
@media(max-width:600px){
 main{padding:14px}
 .games{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .game-card{min-height:140px;padding:15px 8px}
 .appbar{height:49px}
 .ui-btn{padding:9px;font-size:12px}
 #help{font-size:11px}
}
</style>
</head>
<body>
<header>
  <h1>JAAT GAMING ZONE</h1>
  <p>Choose a game. Enter the action.</p>
</header>

<main>
  <div class="games">
    <button class="game-card" data-game="runner"><span class="game-icon">🏃</span><h3>Save Block</h3><p>Run, jump and dodge</p></button>
    <button class="game-card" data-game="snake"><span class="game-icon">🐍</span><h3>Neon Snake</h3><p>Eat, grow and survive</p></button>
    <button class="game-card" data-game="space"><span class="game-icon">🚀</span><h3>Space Shooter</h3><p>Fight in space</p></button>
    <button class="game-card" data-game="memory"><span class="game-icon">🧠</span><h3>Memory Match</h3><p>Find matching pairs</p></button>
    <button class="game-card" data-game="ttt"><span class="game-icon">⭕</span><h3>Tic-Tac-Toe</h3><p>Play against the CPU</p></button>
    <button class="game-card" data-game="brick"><span class="game-icon">🧱</span><h3>Brick Breaker</h3><p>Break every brick</p></button>
  </div>
</main>
<footer>JAAT GAMING ZONE · Play anywhere</footer>

<section id="app" aria-label="Game screen">
  <div class="appbar">
    <button id="back" class="ui-btn">← Back</button>
    <h2 id="gameTitle">NEON SNAKE</h2>
    <button id="full" class="ui-btn">⛶ Fullscreen</button>
  </div>
  <div id="scoreline">Score: 0</div>
  <div id="stage"><canvas id="gameCanvas"></canvas></div>
  <div id="help">Swipe to play</div>
  <div style="text-align:center;padding:0 0 8px;flex-shrink:0">
    <button id="restart" class="ui-btn">↻ Restart Game</button>
  </div>
</section>

<script>
(() => {
'use strict';

const app = document.getElementById('app');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const title = document.getElementById('gameTitle');
const scoreline = document.getElementById('scoreline');
const help = document.getElementById('help');

let game = '';
let state = {};
let W = 800, H = 500, dpr = 1;
let raf = 0, last = 0, pointerStart = null;
let snakeAccumulator = 0;

const names = {
  runner:'NEON RUNNER', snake:'NEON SNAKE',
  space:'SPACE SHOOTER', memory:'MEMORY MATCH',
  ttt:'TIC-TAC-TOE', brick:'BRICK BREAKER'
};

const instructions = {
  runner:'Tap to jump. Swipe left or right to change lanes.',
  snake:'Swipe in any direction to steer. Eat food and avoid yourself.',
  space:'Drag to move your ship. Hold your finger to shoot.',
  memory:'Tap two cards to find a matching pair.',
  ttt:'You are X. Tap a square to play.',
  brick:'Move your finger to control the paddle.'
};

function resizeCanvas() {
  if (!app.classList.contains('active')) return;
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width;
  H = rect.height;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (game === 'snake' && state.body) {
    makeSnakeBoard(true);
  }
}
window.addEventListener('resize', resizeCanvas);

function score(text) { scoreline.textContent = text; }
function message(text) { help.textContent = text; }

function roundRect(x,y,w,h,r,fill) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}
function background() {
  ctx.fillStyle = '#080b18';
  ctx.fillRect(0,0,W,H);
}
function textCenter(text,y,size,color='#fff') {
  ctx.textAlign='center';
  ctx.fillStyle=color;
  ctx.font=`bold ${size}px Arial`;
  ctx.fillText(text,W/2,y);
  ctx.textAlign='left';
}
function gameOver(text) {
  state.over = true;
  state.result = text;
}
function overlayResult() {
  ctx.fillStyle='rgba(3,6,18,.78)';
  ctx.fillRect(0,0,W,H);
  textCenter(state.result || 'GAME OVER',H/2-5,Math.min(36,W/12),'#67e8f9');
  textCenter('Tap Restart Game',H/2+32,Math.min(17,W/24),'#fff');
}

function startGame(name) {
  stopLoop();
  game=name;
  state={};
  title.textContent=names[name];
  message(instructions[name]);
  app.classList.add('active');
  document.body.style.overflow='hidden';
  resizeCanvas();
  resetGame();
  // Browser fullscreen generally requires a direct user gesture.
  if (name==='snake' && app.requestFullscreen) {
    app.requestFullscreen().catch(()=>{});
  }
  raf=requestAnimationFrame(frame);
}

function closeGame() {
  stopLoop();
  if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(()=>{});
  }
  app.classList.remove('active');
  document.body.style.overflow='';
  game='';
  state={};
  pointerStart=null;
}

function stopLoop() {
  if (raf) cancelAnimationFrame(raf);
  raf=0;
}

function resetGame() {
  pointerStart=null;
  snakeAccumulator=0;
  last=0;

  if(game==='snake') {
    makeSnakeBoard(false);
    const midX=Math.floor(state.cols/2);
    const midY=Math.floor(state.rows/2);
    state.body=[
      {x:midX,y:midY},
      {x:midX-1,y:midY},
      {x:midX-2,y:midY}
    ];
    state.dir={x:1,y:0};
    state.nextDir={x:1,y:0};
    state.points=0;
    state.over=false;
    placeFood();
    score('Score: 0');
  }

  if(game==='runner') {
    state={lane:1,obstacles:[],points:0,tick:0,over:false,jump:0};
    score('Score: 0');
  }

  if(game==='space') {
    state={x:W/2,shots:[],rocks:[],points:0,tick:0,over:false,firing:false};
    score('Score: 0');
  }

  if(game==='memory') {
    const symbols=['🍎','🍋','🍇','🍒','⭐','🚀','🐼','💎'];
    const deck=[...symbols,...symbols].sort(()=>Math.random()-.5);
    state={deck,shown:[],matched:[],moves:0,over:false,lock:false};
    score('Pairs: 0 / 8 · Moves: 0');
  }

  if(game==='ttt') {
    state={board:Array(9).fill(''),turn:'X',over:false,points:0};
    score('Your turn: X');
  }

  if(game==='brick') {
    const cols=8, rows=4, gap=5, margin=18;
    const bw=(W-margin*2-gap*(cols-1))/cols;
    const bricks=[];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
      bricks.push({x:margin+c*(bw+gap),y:35+r*25,w:bw,h:18,alive:true});
    }
    state={x:W/2,y:H-45,dx:3.2,dy:-3.5,paddle:W/5,bricks,points:0,over:false};
    score('Score: 0');
  }
  if(game==='snake') message(instructions.snake);
  draw();
}

function makeSnakeBoard(keepBody) {
  const cell=Math.max(10,Math.min(26,Math.floor(Math.min(W/20,H/18))));
  const cols=Math.max(8,Math.floor(W/cell));
  const rows=Math.max(8,Math.floor(H/cell));
  const old=state.body || [];
  state.cell=cell; state.cols=cols; state.rows=rows;
  state.ox=(W-cols*cell)/2; state.oy=(H-rows*cell)/2;
  if(keepBody) {
    state.body=old.filter(p=>p.x<cols&&p.y<rows);
    if(state.body.length<2) {
      const x=Math.floor(cols/2),y=Math.floor(rows/2);
      state.body=[{x,y},{x:x-1,y}];
    }
    if(state.food && (state.food.x>=cols || state.food.y>=rows)) placeFood();
  }
}

function placeFood() {
  if(state.body.length >= state.cols*state.rows) {
    gameOver('YOU WIN!');
    return;
  }
  let p,tries=0;
  do {
    p={x:Math.floor(Math.random()*state.cols),y:Math.floor(Math.random()*state.rows)};
    tries++;
  } while(state.body.some(b=>b.x===p.x&&b.y===p.y)&&tries<1000);
  state.food=p;
}

function turnSnake(x,y) {
  const d=state.nextDir||state.dir;
  if(x===-d.x&&y===-d.y)return;
  state.nextDir={x,y};
}

function updateSnake(dt) {
  if(state.over)return;
  snakeAccumulator+=dt;
  const speed=Math.max(65,120-state.points/4);
  if(snakeAccumulator<speed)return;
  snakeAccumulator=0;
  state.dir={...state.nextDir};
  const head=state.body[0];
  const next={x:head.x+state.dir.x,y:head.y+state.dir.y};
  const eating=next.x===state.food.x&&next.y===state.food.y;
  const collision= eating ? state.body : state.body.slice(0,-1);
  if(next.x<0||next.y<0||next.x>=state.cols||next.y>=state.rows||
     collision.some(p=>p.x===next.x&&p.y===next.y)) {
    gameOver('GAME OVER');
    message('Final score: '+state.points+'. Tap Restart.');
    return;
  }
  state.body.unshift(next);
  if(eating) {
    state.points+=10;
    placeFood();
    score('Score: '+state.points);
  } else state.body.pop();
}

function drawSnake() {
  background();
  const {cell:c,ox,oy,cols,rows}=state;
  if(!c)return;
  ctx.strokeStyle='#17233d';
  ctx.lineWidth=1;
  for(let x=0;x<=cols;x++){
    ctx.beginPath();ctx.moveTo(ox+x*c,oy);ctx.lineTo(ox+x*c,oy+rows*c);ctx.stroke();
  }
  for(let y=0;y<=rows;y++){
    ctx.beginPath();ctx.moveTo(ox,oy+y*c);ctx.lineTo(ox+cols*c,oy+y*c);ctx.stroke();
  }
  const f=state.food;
  if(f) {
    ctx.shadowBlur=15;ctx.shadowColor='#fb7185';ctx.fillStyle='#fb7185';
    ctx.beginPath();ctx.arc(ox+(f.x+.5)*c,oy+(f.y+.5)*c,c*.34,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  state.body.forEach((p,i)=>{
    ctx.shadowBlur=i===0?12:3;
    ctx.shadowColor=i===0?'#67e8f9':'#8b5cf6';
    roundRect(ox+p.x*c+1,oy+p.y*c+1,c-2,c-2,Math.max(2,c*.2),i===0?'#67e8f9':'#8b5cf6');
  });
  ctx.shadowBlur=0;
  if(state.over)overlayResult();
}

function updateRunner(dt) {
  if(state.over)return;
  state.tick+=dt;
  if(state.jump>0)state.jump=Math.max(0,state.jump-dt);
  if(state.tick>650) {
    state.tick=0;
    state.obstacles.push({lane:Math.floor(Math.random()*3),y:-40});
  }
  const speed=dt*.22;
  state.obstacles.forEach(o=>o.y+=speed);
  state.obstacles=state.obstacles.filter(o=>o.y<H+30);
  const py=H-80-(state.jump>0?45:0);
  if(state.obstacles.some(o=>o.lane===state.lane&&o.y>py-24&&o.y<py+28)) {
    gameOver('GAME OVER');
    message('Final score: '+state.points+'. Tap Restart.');
  } else {
    state.points+=dt*.008;
    score('Score: '+Math.floor(state.points));
  }
}
function drawRunner() {
  background();
  for(let i=1;i<3;i++){
    ctx.strokeStyle='#252b48';ctx.setLineDash([8,10]);
    ctx.beginPath();ctx.moveTo(W*i/3,0);ctx.lineTo(W*i/3,H);ctx.stroke();
    ctx.setLineDash([]);
  }
  state.obstacles.forEach(o=>{
    const x=W*(o.lane+.5)/3;
    roundRect(x-W*.055,o.y,W*.11,28,6,'#fb7185');
  });
  const x=W*(state.lane+.5)/3,y=H-70-(state.jump>0?45:0);
  roundRect(x-W*.035,y,W*.07,40,10,'#67e8f9');
  if(state.over)overlayResult();
}

function updateSpace(dt) {
  if(state.over)return;
  state.tick+=dt;
  if(state.firing&&state.tick%110<dt)state.shots.push({x:state.x,y:H-75});
  if(state.tick%650<dt)state.rocks.push({x:20+Math.random()*(W-40),y:-20,r:Math.max(9,W*.018)});
  state.shots.forEach(a=>a.y-=dt*.48);
  state.rocks.forEach(r=>r.y+=dt*.19);
  for(const a of state.shots)for(const r of state.rocks) {
    if(!r.dead&&Math.hypot(a.x-r.x,a.y-r.y)<r.r+5){r.dead=true;a.dead=true;state.points+=10;}
  }
  state.shots=state.shots.filter(a=>!a.dead&&a.y>-20);
  state.rocks=state.rocks.filter(r=>!r.dead&&r.y<H+30);
  if(state.rocks.some(r=>Math.hypot(r.x-state.x,r.y-(H-55))<r.r+15)) {
    gameOver('SHIP DESTROYED');
    message('Final score: '+state.points+'. Tap Restart.');
  }
  score('Score: '+state.points);
}
function drawSpace() {
  background();
  for(let i=0;i<65;i++){
    ctx.fillStyle='#a5b4fc';ctx.fillRect((i*139)%W,(i*73+state.tick*.025)%H,2,2);
  }
  state.shots.forEach(a=>roundRect(a.x-2,a.y,4,13,2,'#67e8f9'));
  state.rocks.forEach(r=>{
    ctx.fillStyle='#fb7185';ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle='#67e8f9';ctx.beginPath();
  ctx.moveTo(state.x,H-85);ctx.lineTo(state.x-17,H-43);ctx.lineTo(state.x,H-51);ctx.lineTo(state.x+17,H-43);ctx.closePath();ctx.fill();
  if(state.over)overlayResult();
}

function drawMemory() {
  background();
  const cols=4,rows=4,gap=8;
  const cardW=Math.min((W-28-gap*3)/4,110);
  const cardH=Math.min((H-35-gap*3)/4,100);
  const totalW=cols*cardW+(cols-1)*gap;
  const totalH=rows*cardH+(rows-1)*gap;
  const ox=(W-totalW)/2,oy=(H-totalH)/2;
  state.cardLayout={ox,oy,cardW,cardH,gap,cols};
  state.deck.forEach((sym,i)=>{
    const x=ox+(i%cols)*(cardW+gap),y=oy+Math.floor(i/cols)*(cardH+gap);
    const open=state.shown.includes(i)||state.matched.includes(i);
    roundRect(x,y,cardW,cardH,10,open?'#202d4b':'#17203a');
    ctx.strokeStyle=open?'#67e8f9':'#394765';ctx.lineWidth=1.5;
    ctx.strokeRect(x+1,y+1,cardW-2,cardH-2);
    if(open){ctx.textAlign='center';ctx.font=`${Math.min(36,cardH*.48)}px Arial`;ctx.fillText(sym,x+cardW/2,y+cardH*.65);ctx.textAlign='left';}
    else textCenter('?',y+cardH*.67,Math.min(32,cardH*.45),'#8b5cf6');
  });
  if(state.over)overlayResult();
}

function drawTTT() {
  background();
  const size=Math.min(W*.78,H*.78,420),cell=size/3;
  const ox=(W-size)/2,oy=(H-size)/2;
  state.boardLayout={ox,oy,size,cell};
  for(let i=0;i<9;i++){
    const x=ox+(i%3)*cell,y=oy+Math.floor(i/3)*cell;
    roundRect(x+4,y+4,cell-8,cell-8,12,'#151e35');
    if(state.board[i]){
      ctx.textAlign='center';ctx.font=`bold ${cell*.55}px Arial`;
      ctx.fillStyle=state.board[i]==='X'?'#67e8f9':'#c4b5fd';
      ctx.fillText(state.board[i],x+cell/2,y+cell*.68);ctx.textAlign='left';
    }
  }
  if(state.over)overlayResult();
}
function checkWinner(b) {
  const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const line of lines)if(b[line[0]]&&b[line[0]]===b[line[1]]&&b[line[1]]===b[line[2]])return b[line[0]];
  return b.every(Boolean)?'draw':null;
}
function tttMove(i) {
  if(state.over||state.board[i])return;
  state.board[i]='X';
  let winner=checkWinner(state.board);
  if(winner){finishTTT(winner);return;}
  const empty=state.board.map((v,i)=>v?null:i).filter(v=>v!==null);
  if(empty.length) {
    const move=empty[Math.floor(Math.random()*empty.length)];
    state.board[move]='O';
  }
  winner=checkWinner(state.board);
  if(winner)finishTTT(winner);
  else score('Your turn: X');
}
function finishTTT(w) {
  state.over=true;
  state.result=w==='draw'?'DRAW!':w==='X'?'YOU WIN!':'CPU WINS!';
  score(state.result);
}

function updateBrick(dt) {
  if(state.over)return;
  state.x+=state.dx*dt*.06;
  state.y+=state.dy*dt*.06;
  if(state.x<8||state.x>W-8)state.dx*=-1;
  if(state.y<8)state.dy=Math.abs(state.dy);
  if(state.y>H-40&&state.y<H-25&&state.x>state.paddle-state.paddle/2-8&&state.x<state.paddle+state.paddle/2+8) {
    state.dy=-Math.abs(state.dy);
    state.dx+=(state.x-state.paddle)*.015;
  }
  for(const b of state.bricks)if(b.alive&&state.x>b.x&&state.x<b.x+b.w&&state.y>b.y&&state.y<b.y+b.h) {
    b.alive=false;state.dy*=-1;state.points+=10;score('Score: '+state.points);break;
  }
  if(state.y>H+15)gameOver('GAME OVER');
  if(state.bricks.every(b=>!b.alive))gameOver('YOU WIN!');
}
function drawBrick() {
  background();
  state.bricks.forEach((b,i)=>{if(b.alive)roundRect(b.x,b.y,b.w,b.h,4,['#67e8f9','#8b5cf6','#fb7185','#fbbf24'][Math.floor(i/8)]);});
  roundRect(state.paddle-state.paddle/2,H-35,state.paddle,12,6,'#67e8f9');
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(state.x,state.y,7,0,Math.PI*2);ctx.fill();
  if(state.over)overlayResult();
}

function draw() {
  if(!app.classList.contains('active'))return;
  if(game==='snake')drawSnake();
  else if(game==='runner')drawRunner();
  else if(game==='space')drawSpace();
  else if(game==='memory')drawMemory();
  else if(game==='ttt')drawTTT();
  else if(game==='brick')drawBrick();
}
function frame(t) {
  if(!app.classList.contains('active'))return;
  const dt=Math.min(t-(last||t),40);
  last=t;
  if(game==='snake')updateSnake(dt);
  if(game==='runner')updateRunner(dt);
  if(game==='space')updateSpace(dt);
  if(game==='brick')updateBrick(dt);
  draw();
  raf=requestAnimationFrame(frame);
}

function point(e) {
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}

canvas.addEventListener('pointerdown',e=>{
  if(!app.classList.contains('active'))return;
  e.preventDefault();
  const p=point(e);
  pointerStart=p;
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  if(game==='space'){state.x=p.x;state.firing=true;}
  if(game==='brick')state.paddle=Math.max(state.paddle/2,Math.min(W-state.paddle/2,p.x));
},{passive:false});

canvas.addEventListener('pointermove',e=>{
  if(!app.classList.contains('active'))return;
  const p=point(e);
  if(game==='space'&&state.firing)state.x=Math.max(18,Math.min(W-18,p.x));
  if(game==='brick'&&(e.buttons||e.pointerType==='touch'))state.paddle=Math.max(state.paddle/2,Math.min(W-state.paddle/2,p.x));
},{passive:false});

canvas.addEventListener('pointerup',e=>{
  if(!app.classList.contains('active'))return;
  e.preventDefault();
  const p=point(e),start=pointerStart;
  if(start) {
    const dx=p.x-start.x,dy=p.y-start.y;
    if(game==='snake'&&!state.over&&Math.max(Math.abs(dx),Math.abs(dy))>15) {
      if(Math.abs(dx)>Math.abs(dy))turnSnake(dx>0?1:-1,0);
      else turnSnake(0,dy>0?1:-1);
    }
    if(game==='runner'&&!state.over&&Math.max(Math.abs(dx),Math.abs(dy))>25) {
      if(Math.abs(dx)>Math.abs(dy))state.lane=Math.max(0,Math.min(2,state.lane+(dx>0?1:-1)));
      else if(dy<0)state.jump=450;
    } else if(game==='runner'&&!state.over&&Math.abs(dx)<20&&Math.abs(dy)<20) {
      state.jump=450;
    }
    if(game==='memory'&&!state.over)memoryTap(p.x,p.y);
    if(game==='ttt'&&!state.over)tttTap(p.x,p.y);
  }
  pointerStart=null;
  if(game==='space')state.firing=false;
},{passive:false});
canvas.addEventListener('pointercancel',()=>{pointerStart=null;if(game==='space')state.firing=false;});

function memoryTap(x,y) {
  const l=state.cardLayout;if(!l||state.lock)return;
  const col=Math.floor((x-l.ox)/(l.cardW+l.gap));
  const row=Math.floor((y-l.oy)/(l.cardH+l.gap));
  if(col<0||col>=4||row<0||row>=4)return;
  const i=row*4+col;
  const cx=l.ox+col*(l.cardW+l.gap),cy=l.oy+row*(l.cardH+l.gap);
  if(x>cx+l.cardW||y>cy+l.cardH||state.matched.includes(i)||state.shown.includes(i))return;
  state.shown.push(i);
  if(state.shown.length===2) {
    state.moves++;
    const [a,b]=state.shown;
    if(state.deck[a]===state.deck[b]) {
      state.matched.push(a,b);state.shown=[];
      if(state.matched.length===state.deck.length) {
        state.over=true;state.result='YOU WIN!';
      }
    } else {
      state.lock=true;
      setTimeout(()=>{
        if(game==='memory'){state.shown=[];state.lock=false;draw();}
      },650);
    }
  }
  score(`Pairs: ${state.matched.length/2} / 8 · Moves: ${state.moves}`);
  draw();
}
function tttTap(x,y) {
  const l=state.boardLayout;if(!l)return;
  const col=Math.floor((x-l.ox)/l.cell),row=Math.floor((y-l.oy)/l.cell);
  if(col<0||col>2||row<0||row>2)return;
  tttMove(row*3+col);draw();
}

document.querySelectorAll('[data-game]').forEach(btn=>{
  btn.addEventListener('click',()=>startGame(btn.dataset.game));
});
document.getElementById('back').addEventListener('click',closeGame);
document.getElementById('restart').addEventListener('click',resetGame);
document.getElementById('full').addEventListener('click',()=>{
  if(!document.fullscreenElement&&app.requestFullscreen)app.requestFullscreen().catch(()=>{});
  else if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});
});
document.addEventListener('fullscreenchange',()=>{resizeCanvas();});

document.addEventListener('keydown',e=>{
  if(!app.classList.contains('active'))return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(game==='snake') {
    if(e.key==='ArrowUp'||e.key==='w')turnSnake(0,-1);
    if(e.key==='ArrowDown'||e.key==='s')turnSnake(0,1);
    if(e.key==='ArrowLeft'||e.key==='a')turnSnake(-1,0);
    if(e.key==='ArrowRight'||e.key==='d')turnSnake(1,0);
  }
  if(game==='runner'&&!state.over) {
    if(e.key==='ArrowLeft')state.lane=Math.max(0,state.lane-1);
    if(e.key==='ArrowRight')state.lane=Math.min(2,state.lane+1);
    if(e.key==='ArrowUp'||e.key===' ')state.jump=450;
  }
  if(e.key==='Escape'&&app.classList.contains('active')&&!document.fullscreenElement)closeGame();
});
})();
</script>
